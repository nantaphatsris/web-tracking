
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Night Sky Tracker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #090d12;
      color: #edf2f7;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 20px;
      border-bottom: 1px solid #26313d;
    }

    h1 {
      font-size: 18px;
      margin: 0;
    }

    main {
      max-width: 600px;
      margin: auto;
      padding: 16px;
    }

    .camera-view {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      background: #030609;
      border: 1px solid #354352;
      border-radius: 12px;
      overflow: hidden;
      touch-action: manipulation;
    }

    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* วงกลมอ้างอิงตรงกลาง */
    .crosshair {
      position: absolute;
      width: 20px;
      height: 20px;
      border: 2px solid #6000fb;
      border-radius: 50%;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 2;
    }

    /* จุดกำเนิดพิกัด (0, 0) */
    .crosshair::before {
      content: "";
      position: absolute;
      width: 5px;
      height: 5px;
      background: #4400ff;
      border-radius: 50%;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    .crosshair::after {
      content: none;
    }

    /* กล่องแสดงพิกัด */
    .coordinates {
      position: absolute;
      left: 12px;
      bottom: 12px;
      padding: 8px 10px;
      background: rgba(0, 0, 0, 0.8);
      color: #0bf4ec;
      font-size: 13px;
      font-family: monospace;
      line-height: 1.8;
      border: 1px solid #26313d;
      border-radius: 6px;
      pointer-events: none;
      z-index: 3;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      border: none;
      border-radius: 8px;
      background: #0bf4ec;
      color: #10241a;
      font-size: 15px;
      cursor: pointer;
    }

    button:active {
      opacity: 0.8;
    }

    #status {
      color: #9eacbd;
      font-size: 13px;
      margin-top: 12px;
      line-height: 1.6;
    }

    .hint {
      color: #9eacbd;
      font-size: 12px;
      line-height: 1.6;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <header>
    <h1>✳ NIGHT SKY TRACKER</h1>
  </header>

  <main>
    <div class="camera-view" id="cameraView">
      <video id="camera" autoplay playsinline muted></video>

      <!-- จุดกำเนิดพิกัด -->
      <div class="crosshair"></div>

      <!-- แสดงพิกัด -->
      <div class="coordinates">
        X: <span id="coordX">0</span><br>
        Y: <span id="coordY">0</span>
      </div>
    </div>

    <button id="startCamera">เปิดกล้อง</button>

    <div id="status">สถานะ: ยังไม่ได้เปิดกล้อง</div>

    <div class="hint">
      แตะตำแหน่งบนภาพเพื่ออ่านพิกัดสัมพัทธ์
      โดยจุดกึ่งกลางคือ (0, 0)
    </div>
  </main>

  <script>
    const camera = document.getElementById("camera");
    const cameraView = document.getElementById("cameraView");
    const button = document.getElementById("startCamera");
    const status = document.getElementById("status");
    const coordX = document.getElementById("coordX");
    const coordY = document.getElementById("coordY");

    let stream = null;

    // พิกัดของตำแหน่งที่เลือก
    let selectedX = 0;
    let selectedY = 0;

    // แสดงพิกัดที่เลือก
    function displayCoordinates(x, y) {
      selectedX = Math.round(x);
      selectedY = Math.round(y);

      coordX.textContent = selectedX;
      coordY.textContent = selectedY;
    }

    // แปลงตำแหน่งหน้าจอเป็นพิกัด XY
    // จุดกึ่งกลาง = (0, 0)
    // X บวกไปทางขวา
    // Y บวกขึ้นด้านบน
    function getXY(clientX, clientY) {
      const rect = cameraView.getBoundingClientRect();

      return {
        x: clientX - rect.left - rect.width / 2,
        y: rect.height / 2 - (clientY - rect.top)
      };
    }

    // แตะหรือคลิกบนภาพเพื่ออ่านพิกัด
    cameraView.addEventListener("pointerdown", (event) => {
      const point = getXY(event.clientX, event.clientY);

      displayCoordinates(point.x, point.y);
    });

    // อัปเดตเมื่อขนาดหน้าจอเปลี่ยน
    window.addEventListener("resize", () => {
      // จุดกำเนิดยังคงอยู่ตรงกลาง
      // ค่าพิกัดที่เลือกจะไม่เปลี่ยนโดยอัตโนมัติ
    });

    // เปิดกล้อง
    button.addEventListener("click", async () => {
      try {
        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error(
            "เบราว์เซอร์ไม่รองรับการเปิดกล้อง กรุณาใช้ HTTPS"
          );
        }

        if (stream) {
          status.textContent = "สถานะ: กล้องกำลังทำงาน";
          return;
        }

        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" }
          },
          audio: false
        });

        camera.srcObject = stream;
        await camera.play();

        status.textContent = "สถานะ: เปิดกล้องสำเร็จ";
        button.textContent = "กล้องกำลังทำงาน";

      } catch (error) {
        status.textContent =
          "เปิดกล้องไม่สำเร็จ: " + error.message;

        if (stream) {
          stream.getTracks().forEach(track => track.stop());
        }

        stream = null;
      }
    });

    // ค่าเริ่มต้น จุดกึ่งกลาง
    displayCoordinates(0, 0);
  </script>
</body>
</html>
